[project]
name = "web-data-platform"
version = "0.1.0"
description = "Enterprise Web Data Acquisition & Automation Platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

# Dependency groups (PEP 735). Each app installs only the group(s) it
# needs so the API image doesn't ship Celery, and the worker image
# doesn't ship FastAPI. `dev` is installed everywhere in local/CI.
[dependency-groups]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "structlog>=24.4",
    # Phase 1: session storage (opaque tokens) — Redis is already part
    # of the platform (Celery broker), reused here rather than adding
    # new infra (ADR-003).
    "redis>=5.0",
    # Phase 1: Argon2id password hashing (approved Decision B).
    "argon2-cffi>=23.1.0",
    # Phase 1: needed for pydantic's EmailStr validator.
    "email-validator>=2.1",
]
worker = [
    "celery[redis]>=5.4",
    "redis>=5.0",
    "structlog>=24.4",
]
scheduler = [
    "celery[redis]>=5.4",
    "structlog>=24.4",
]
dev = [
    "ruff>=0.7",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

# This is a monorepo workspace, not an installable Python package.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# FastAPI's Depends()/Cookie()/Header() in argument defaults is the
# framework's own idiomatic pattern, not the mutable-default-argument
# bug B008 exists to catch — found by actually running ruff against
# every route/dependency (31 false-positive hits). Whitelisting these
# specific callables is the standard fix for FastAPI + ruff, not a
# blanket B008 disable.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Cookie",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
    # our own dependency FACTORY (returns a Depends-compatible
    # callable) — same B008 false-positive as FastAPI's own Depends,
    # found by actually running ruff.
    "app.api.deps.require_role",
    "app.api.deps.require_project_role",
    "app.api.deps.require_scraper_role",
    "app.api.deps.require_target_role",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
# Section 80: tightened module-by-module, not blanket-strict from day one
disallow_untyped_defs = false
exclude = ["migrations/"]

# celery ships no type stubs / py.typed marker upstream (found by
# actually running mypy — see PHASE_0_REPORT.md). Not our code being
# untyped; ignoring missing stubs for this one third-party package
# is the honest fix, not a blanket relaxation of mypy for our code.
[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["apps"]
asyncio_mode = "auto"
# The API's SQLAlchemy async engine (apps/api/app/core/database.py)
# is a module-level singleton created once at import time and bound
# to whichever asyncio event loop is running then. pytest-asyncio's
# default is a NEW event loop per test function, which breaks that
# engine's connection pool for every test after the first with
# "attached to a different loop" (found by actually running the
# integration tests in CI). Session-scoped test loop matches the
# engine's actual (single-process) lifetime.
asyncio_default_test_loop_scope = "session"
# apps/api/app and apps/worker/worker (and apps/scheduler/scheduler)
# are each their own top-level package rooted at a different
# directory. Without this, pytest can't resolve `from app...` or
# `from worker...` imports when run from the repo root (found by
# actually running pytest — see PHASE_0_REPORT.md).
pythonpath = ["apps/api", "apps/worker", "apps/scheduler"]
markers = [
    "integration: requires a live PostgreSQL/Redis instance (see docker-compose.yml); skipped in unit-only runs",
]
