[project]
name = "web-data-platform"
version = "0.1.0"
description = "Enterprise Web Data Acquisition & Automation Platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

# Dependency groups (PEP 735). Each app installs only the group(s) it
# needs so the API image doesn't ship Celery, and the worker image
# doesn't ship FastAPI. `dev` is installed everywhere in local/CI.
[dependency-groups]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "structlog>=24.4",
]
worker = [
    "celery[redis]>=5.4",
    "redis>=5.0",
    "structlog>=24.4",
]
scheduler = [
    "celery[redis]>=5.4",
    "structlog>=24.4",
]
dev = [
    "ruff>=0.7",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

# This is a monorepo workspace, not an installable Python package.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
exclude = ["migrations/"]

# celery ships no type stubs upstream (found by actually running mypy)
[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["apps"]
asyncio_mode = "auto"
# apps/api/app, apps/worker/worker, apps/scheduler/scheduler are each
# their own top-level package — pytest needs this to resolve imports
# (found by actually running pytest)
pythonpath = ["apps/api", "apps/worker", "apps/scheduler"]
markers = [
    "integration: requires a live PostgreSQL/Redis instance (see docker-compose.yml); skipped in unit-only runs",
]