services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: platform
      MINIO_ROOT_PASSWORD: platform123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  # Scheduler is NOT part of the default `docker compose up`. Its
  # entrypoint intentionally raises NotImplementedError until Phase 6
  # exists (see infrastructure/docker/Dockerfile.scheduler) — starting
  # it by default would crash-loop for no reason. Run it explicitly
  # once you want to see that fail-fast behavior:
  #   docker compose --profile scheduler up scheduler
  scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.scheduler
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["scheduler"]

  # frontend: deliberately omitted from Phase 0. frontend/dashboard/
  # has no real Next.js application yet (see its README) — adding a
  # compose service for a non-existent app would be exactly the kind
  # of fake completeness Section 1.5 forbids. Added in Phase 9.

volumes:
  postgres_data:
  minio_data:
