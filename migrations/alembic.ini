[alembic]
script_location = migrations
prepend_sys_path = .

# sqlalchemy.url is deliberately left blank here — migrations/env.py
# reads DATABASE_URL from the environment at runtime instead, so the
# exact same migration set works across development/test/staging
# without editing this file (Section 8: schema changes via migrations
# only, driven by real config, not hand-edited per environment).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
